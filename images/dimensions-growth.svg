<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="meaningGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7b61ff"/>
      <stop offset="50%" stop-color="#ff61c7"/>
      <stop offset="100%" stop-color="#3ddc84"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#0f1419"/>
  <text x="400" y="50" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">More Dimensions = More Meaning</text>

  <!-- 2D plane -->
  <g>
    <polygon points="60,300 230,300 200,210 30,210" fill="#1b3a6b" stroke="#4d9bff" stroke-width="2"/>
    <circle cx="140" cy="258" r="8" fill="#4d9bff"/>
    <text x="130" y="350" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#4d9bff" text-anchor="middle">2D</text>
    <text x="130" y="378" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#cfd6e0" text-anchor="middle">GPS: lat/lon</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="250" y1="255" x2="320" y2="255" stroke="#8a94a6" stroke-width="3"/>
  <polygon points="320,255 306,248 306,262" fill="#8a94a6"/>

  <!-- 3D cube -->
  <g>
    <rect x="350" y="220" width="90" height="90" fill="#3a2c6b" stroke="#9b7bff" stroke-width="2"/>
    <polygon points="350,220 380,190 470,190 440,220" fill="#4a3a82" stroke="#9b7bff" stroke-width="2"/>
    <polygon points="440,220 470,190 470,280 440,310" fill="#2e2356" stroke="#9b7bff" stroke-width="2"/>
    <circle cx="400" cy="255" r="8" fill="#9b7bff"/>
    <text x="410" y="355" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#9b7bff" text-anchor="middle">3D</text>
    <text x="410" y="383" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#cfd6e0" text-anchor="middle">x, y, z</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="490" y1="255" x2="560" y2="255" stroke="#8a94a6" stroke-width="3"/>
  <polygon points="560,255 546,248 546,262" fill="#8a94a6"/>

  <!-- High-dim burst -->
  <g>
    <g stroke="url(#meaningGrad)" stroke-width="2.5" stroke-linecap="round">
      <line x1="680" y1="255" x2="680" y2="185"/>
      <line x1="680" y1="255" x2="680" y2="325"/>
      <line x1="680" y1="255" x2="610" y2="255"/>
      <line x1="680" y1="255" x2="750" y2="255"/>
      <line x1="680" y1="255" x2="630" y2="205"/>
      <line x1="680" y1="255" x2="730" y2="205"/>
      <line x1="680" y1="255" x2="630" y2="305"/>
      <line x1="680" y1="255" x2="730" y2="305"/>
      <line x1="680" y1="255" x2="640" y2="190"/>
      <line x1="680" y1="255" x2="720" y2="320"/>
    </g>
    <circle cx="680" cy="255" r="12" fill="url(#meaningGrad)"/>
    <text x="680" y="355" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#ff61c7" text-anchor="middle">1536D</text>
    <text x="680" y="383" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#cfd6e0" text-anchor="middle">meaning space</text>
  </g>

  <text x="400" y="450" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8a94a6" text-anchor="middle" font-style="italic">Each new dimension captures another nuance of meaning</text>
</svg>
