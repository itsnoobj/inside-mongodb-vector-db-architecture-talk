<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0f1419"/>
  <text x="400" y="50" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Cosine Similarity: Angle = Meaning</text>

  <!-- Origin marker -->
  <circle cx="180" cy="420" r="6" fill="#ffffff"/>
  <text x="160" y="450" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8a94a6" text-anchor="middle">origin</text>

  <!-- Green vector (similar) at ~10 degrees above the other -->
  <!-- Vector A: shallow angle (similar) -->
  <line x1="180" y1="420" x2="700" y2="330" stroke="#3ddc84" stroke-width="5" stroke-linecap="round"/>
  <polygon points="700,330 678,322 684,344" fill="#3ddc84"/>
  <text x="560" y="305" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#3ddc84" text-anchor="middle">Long report on churn</text>

  <!-- Vector B: steep angle (dissimilar) -->
  <line x1="180" y1="420" x2="430" y2="100" stroke="#ff5a5a" stroke-width="5" stroke-linecap="round"/>
  <polygon points="430,100 414,118 436,124" fill="#ff5a5a"/>
  <text x="470" y="95" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#ff5a5a" text-anchor="middle">Doc about office furniture</text>

  <!-- Angle arc between the two vectors -->
  <path d="M 320 392 A 150 150 0 0 0 280 290" fill="none" stroke="#ffd166" stroke-width="3"/>
  <text x="318" y="330" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffd166" text-anchor="middle">&#952;</text>

  <!-- Legend -->
  <circle cx="200" cy="120" r="8" fill="#3ddc84"/>
  <text x="216" y="126" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#cfd6e0">Small angle &#8594; similar</text>
  <circle cx="200" cy="150" r="8" fill="#ff5a5a"/>
  <text x="216" y="156" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#cfd6e0">Large angle &#8594; different</text>
</svg>
