<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400">
  <rect width="1120" height="400" fill="#1a1a2e"/>
  <style>text { font-family: Arial, Helvetica, sans-serif; }</style>

  <!-- Left: sentence -->
  <text x="120" y="50" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">Sentence</text>
  <rect x="30" y="70" width="180" height="50" rx="8" fill="#1e3a5f" stroke="#4a9eff" stroke-width="2"/>
  <text x="120" y="101" text-anchor="middle" fill="#aaccff" font-size="14">"I love fries"</text>

  <!-- Arrow -->
  <line x1="220" y1="95" x2="290" y2="95" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#888"/></marker></defs>
  <text x="255" y="82" text-anchor="middle" fill="#888" font-size="11">model</text>

  <!-- Middle: number array -->
  <text x="560" y="50" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">Embedding (384 numbers)</text>
  <rect x="300" y="70" width="520" height="50" rx="8" fill="#1a3a1a" stroke="#66ff66" stroke-width="2"/>
  <text x="560" y="100" text-anchor="middle" fill="#66ff66" font-size="13">[ -0.032, -0.085, 0.025, -0.045, -0.017, -0.066, 0.037, ... ]</text>

  <!-- Arrow down -->
  <line x1="560" y1="130" x2="560" y2="160" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
  <text x="590" y="150" fill="#888" font-size="11">plot as a point</text>

  <!-- Right: meaning space visualization -->
  <rect x="200" y="170" width="720" height="210" rx="10" fill="#0d0d1a" stroke="#333" stroke-width="1"/>
  <text x="560" y="195" text-anchor="middle" fill="#aaa" font-size="12">Meaning Space (simplified to 2D)</text>
  
  <!-- Cluster: food -->
  <circle cx="320" cy="270" r="6" fill="#66ff66"/>
  <text x="330" y="267" fill="#88dd88" font-size="11">I love fries</text>
  <circle cx="340" cy="300" r="5" fill="#44cc44"/>
  <text x="350" y="297" fill="#88dd88" font-size="11">fries are delicious</text>
  <circle cx="290" cy="310" r="5" fill="#44cc44"/>
  <text x="300" y="307" fill="#88dd88" font-size="11">potato snacks</text>
  
  <!-- Cluster: tech -->
  <circle cx="650" cy="250" r="5" fill="#4a9eff"/>
  <text x="660" y="247" fill="#88bbff" font-size="11">machine learning</text>
  <circle cx="680" cy="280" r="5" fill="#4a9eff"/>
  <text x="690" y="277" fill="#88bbff" font-size="11">neural networks</text>
  
  <!-- Cluster: finance -->
  <circle cx="550" cy="340" r="5" fill="#ffaa00"/>
  <text x="560" y="337" fill="#ddaa55" font-size="11">stock market</text>
  <circle cx="590" cy="360" r="5" fill="#ffaa00"/>
  <text x="600" y="357" fill="#ddaa55" font-size="11">trading</text>

  <!-- Distance line -->
  <line x1="320" y1="270" x2="340" y2="300" stroke="#66ff66" stroke-width="1" stroke-dasharray="3"/>
  <line x1="320" y1="270" x2="550" y2="340" stroke="#ff4444" stroke-width="1" stroke-dasharray="3"/>
  
  <text x="420" y="310" text-anchor="middle" fill="#ff8888" font-size="10">far = different meaning</text>
  <text x="310" y="335" text-anchor="middle" fill="#88dd88" font-size="10">close = similar meaning</text>

  <!-- Bottom label -->
  <text x="560" y="395" text-anchor="middle" fill="#aaa" font-size="12">Each sentence becomes a point. Similar meanings cluster together.</text>
</svg>
