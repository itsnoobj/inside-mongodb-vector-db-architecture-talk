<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" font-family="Inter, -apple-system, sans-serif">
  <rect width="1600" height="700" fill="#1a1a2e"/>
  
  <!-- Fix 1: Iterative Scan -->
  <rect x="30" y="20" width="500" height="660" rx="14" fill="#222238" stroke="#a6e3a1" stroke-width="2.5"/>
  <text x="280" y="60" text-anchor="middle" fill="#a6e3a1" font-size="22" font-weight="bold">1. Iterative Scan</text>
  <text x="280" y="90" text-anchor="middle" fill="#ffffff" font-size="15">Keep scanning until enough match</text>
  
  <!-- Visual: expanding search rings - bigger -->
  <circle cx="280" cy="270" r="50" fill="none" stroke="#a6e3a1" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="280" cy="270" r="90" fill="none" stroke="#a6e3a1" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="280" cy="270" r="130" fill="none" stroke="#a6e3a1" stroke-width="1.5" stroke-dasharray="5,4"/>
  <circle cx="280" cy="270" r="165" fill="none" stroke="#6c7086" stroke-width="1"/>
  <!-- dots: green = match, red = filtered out -->
  <circle cx="260" cy="240" r="8" fill="#f38ba8"/>
  <circle cx="305" cy="255" r="8" fill="#a6e3a1"/>
  <circle cx="240" cy="285" r="8" fill="#f38ba8"/>
  <circle cx="320" cy="295" r="8" fill="#f38ba8"/>
  <circle cx="210" cy="210" r="8" fill="#a6e3a1"/>
  <circle cx="365" cy="225" r="8" fill="#f38ba8"/>
  <circle cx="185" cy="310" r="8" fill="#a6e3a1"/>
  <circle cx="390" cy="330" r="8" fill="#f38ba8"/>
  <circle cx="350" cy="170" r="8" fill="#a6e3a1"/>
  <circle cx="215" cy="365" r="8" fill="#f38ba8"/>
  
  <!-- Legend -->
  <circle cx="180" cy="450" r="6" fill="#a6e3a1"/><text x="195" y="455" fill="#ffffff" font-size="13">matching tenant</text>
  <circle cx="340" cy="450" r="6" fill="#f38ba8"/><text x="355" y="455" fill="#ffffff" font-size="13">other tenants</text>
  
  <text x="280" y="510" text-anchor="middle" fill="#ffffff" font-size="15">Scan 40 → not enough → scan 40 more</text>
  <text x="280" y="560" text-anchor="middle" fill="#a6e3a1" font-size="18" font-weight="bold">Works for any filter ✓</text>
  <text x="280" y="595" text-anchor="middle" fill="#cdd6f4" font-size="14">pgvector 0.8+</text>
  <text x="280" y="630" text-anchor="middle" fill="#a6adc8" font-size="13">Best for: high cardinality (10K+ values)</text>
  
  <!-- Fix 2: Partial Index -->
  <rect x="555" y="20" width="490" height="660" rx="14" fill="#222238" stroke="#89b4fa" stroke-width="2.5"/>
  <text x="800" y="60" text-anchor="middle" fill="#89b4fa" font-size="22" font-weight="bold">2. Partial Index</text>
  <text x="800" y="90" text-anchor="middle" fill="#ffffff" font-size="15">Separate graph per filter value</text>
  
  <!-- Visual: separate clusters - bigger -->
  <circle cx="710" cy="220" r="65" fill="none" stroke="#89b4fa" stroke-width="2"/>
  <text x="710" y="225" text-anchor="middle" fill="#89b4fa" font-size="14" font-weight="bold">science</text>
  <circle cx="695" cy="195" r="6" fill="#a6e3a1"/>
  <circle cx="725" cy="195" r="6" fill="#a6e3a1"/>
  <circle cx="695" cy="248" r="6" fill="#a6e3a1"/>
  <circle cx="725" cy="248" r="6" fill="#a6e3a1"/>
  
  <circle cx="890" cy="220" r="65" fill="none" stroke="#89b4fa" stroke-width="2"/>
  <text x="890" y="225" text-anchor="middle" fill="#89b4fa" font-size="14" font-weight="bold">sports</text>
  <circle cx="875" cy="195" r="6" fill="#a6e3a1"/>
  <circle cx="905" cy="195" r="6" fill="#a6e3a1"/>
  <circle cx="875" cy="248" r="6" fill="#a6e3a1"/>
  <circle cx="905" cy="248" r="6" fill="#a6e3a1"/>
  
  <circle cx="800" cy="360" r="65" fill="none" stroke="#89b4fa" stroke-width="2"/>
  <text x="800" y="365" text-anchor="middle" fill="#89b4fa" font-size="14" font-weight="bold">tech</text>
  <circle cx="785" cy="335" r="6" fill="#a6e3a1"/>
  <circle cx="815" cy="335" r="6" fill="#a6e3a1"/>
  <circle cx="785" cy="388" r="6" fill="#a6e3a1"/>
  <circle cx="815" cy="388" r="6" fill="#a6e3a1"/>
  
  <text x="800" y="480" text-anchor="middle" fill="#ffffff" font-size="15">One HNSW graph per category</text>
  <text x="800" y="530" text-anchor="middle" fill="#89b4fa" font-size="18" font-weight="bold">Zero wasted traversal ✓</text>
  <text x="800" y="570" text-anchor="middle" fill="#cdd6f4" font-size="14">CREATE INDEX ... WHERE category = 'X'</text>
  <text x="800" y="630" text-anchor="middle" fill="#a6adc8" font-size="13">Best for: low cardinality (2-100 values)</text>
  
  <!-- Fix 3: Partitioning -->
  <rect x="1070" y="20" width="500" height="660" rx="14" fill="#222238" stroke="#f9e2af" stroke-width="2.5"/>
  <text x="1320" y="60" text-anchor="middle" fill="#f9e2af" font-size="22" font-weight="bold">3. Table Partitioning</text>
  <text x="1320" y="90" text-anchor="middle" fill="#ffffff" font-size="15">One partition + index per tenant</text>
  
  <!-- Visual: stacked table slices - bigger, more prominent -->
  <rect x="1150" y="150" width="340" height="55" rx="8" fill="#f9e2af" opacity="0.15" stroke="#f9e2af" stroke-width="2"/>
  <text x="1320" y="183" text-anchor="middle" fill="#f9e2af" font-size="15" font-weight="bold">Tenant A (+ own HNSW)</text>
  
  <rect x="1150" y="220" width="340" height="55" rx="8" fill="#f9e2af" opacity="0.15" stroke="#f9e2af" stroke-width="2"/>
  <text x="1320" y="253" text-anchor="middle" fill="#f9e2af" font-size="15" font-weight="bold">Tenant B (+ own HNSW)</text>
  
  <rect x="1150" y="290" width="340" height="55" rx="8" fill="#f9e2af" opacity="0.15" stroke="#f9e2af" stroke-width="2"/>
  <text x="1320" y="323" text-anchor="middle" fill="#f9e2af" font-size="15" font-weight="bold">Tenant C (+ own HNSW)</text>
  
  <rect x="1150" y="360" width="340" height="55" rx="8" fill="#f9e2af" opacity="0.08" stroke="#6c7086" stroke-width="1.5"/>
  <text x="1320" y="393" text-anchor="middle" fill="#6c7086" font-size="15">Tenant D ...</text>
  
  <text x="1320" y="480" text-anchor="middle" fill="#ffffff" font-size="15">Storage-level isolation</text>
  <text x="1320" y="530" text-anchor="middle" fill="#f9e2af" font-size="18" font-weight="bold">Scales to thousands ✓</text>
  <text x="1320" y="570" text-anchor="middle" fill="#cdd6f4" font-size="14">PARTITION BY LIST (tenant_id)</text>
  <text x="1320" y="630" text-anchor="middle" fill="#a6adc8" font-size="13">Best for: multi-tenant SaaS</text>
</svg>
