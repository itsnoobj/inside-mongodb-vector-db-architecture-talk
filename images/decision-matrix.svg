<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="monospace">
  <rect width="1200" height="500" fill="#1e1e2e"/>
  
  <!-- Scale arrow -->
  <text x="600" y="40" text-anchor="middle" fill="#6c7086" font-size="16">SCALE →</text>
  <line x1="80" y1="55" x2="1120" y2="55" stroke="#6c7086" stroke-width="1.5"/>
  
  <!-- 4 boxes -->
  <rect x="60" y="80" width="250" height="120" rx="10" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="185" y="120" text-anchor="middle" fill="#a6e3a1" font-size="20" font-weight="bold">&lt; 1M</text>
  <text x="185" y="155" text-anchor="middle" fill="#cdd6f4" font-size="17">pgvector + HNSW</text>
  <text x="185" y="180" text-anchor="middle" fill="#6c7086" font-size="15">Just ship.</text>

  <rect x="340" y="80" width="250" height="120" rx="10" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="465" y="120" text-anchor="middle" fill="#89b4fa" font-size="20" font-weight="bold">1M – 10M</text>
  <text x="465" y="155" text-anchor="middle" fill="#cdd6f4" font-size="17">+ MRL (256d)</text>
  <text x="465" y="180" text-anchor="middle" fill="#6c7086" font-size="15">6× free savings</text>

  <rect x="620" y="80" width="250" height="120" rx="10" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <text x="745" y="120" text-anchor="middle" fill="#f9e2af" font-size="20" font-weight="bold">10M – 50M</text>
  <text x="745" y="155" text-anchor="middle" fill="#cdd6f4" font-size="17">+ Quantization</text>
  <text x="745" y="180" text-anchor="middle" fill="#6c7086" font-size="15">32× smaller</text>

  <rect x="900" y="80" width="250" height="120" rx="10" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
  <text x="1025" y="120" text-anchor="middle" fill="#f38ba8" font-size="20" font-weight="bold">50M+</text>
  <text x="1025" y="155" text-anchor="middle" fill="#cdd6f4" font-size="17">DiskANN</text>
  <text x="1025" y="180" text-anchor="middle" fill="#6c7086" font-size="15">RAM → SSD</text>

  <!-- Divider -->
  <line x1="80" y1="240" x2="1120" y2="240" stroke="#313244" stroke-width="1"/>

  <!-- Takeaway -->
  <text x="600" y="300" text-anchor="middle" fill="#a6e3a1" font-size="26" font-weight="bold">Start with what you have. Stay longer than you think.</text>
  <text x="600" y="345" text-anchor="middle" fill="#cdd6f4" font-size="18">Exhaust: dimensions → quantization → DiskANN</text>
  <text x="600" y="375" text-anchor="middle" fill="#cdd6f4" font-size="18">before adding infrastructure.</text>
</svg>
