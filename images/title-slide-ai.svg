<svg width="1120" height="700" viewBox="0 0 1120 700" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <!-- Node glow -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6c8cff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6c8cff" stop-opacity="0"/>
    </radialGradient>
    <!-- Arrowhead for vector arrows -->
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4f6bbf" opacity="0.6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1120" height="700" fill="url(#bgGrad)"/>

  <!-- ===================== Meaning-map cluster of dots (background) ===================== -->
  <g fill="#3a4a7a" opacity="0.35">
    <!-- left cluster -->
    <circle cx="120" cy="120" r="3"/>
    <circle cx="150" cy="150" r="2.5"/>
    <circle cx="100" cy="170" r="2"/>
    <circle cx="180" cy="110" r="2.5"/>
    <circle cx="140" cy="200" r="2"/>
    <circle cx="90" cy="220" r="3"/>
    <circle cx="200" cy="170" r="2"/>
    <circle cx="170" cy="240" r="2.5"/>
    <circle cx="130" cy="260" r="2"/>
    <circle cx="220" cy="220" r="2"/>
    <!-- right cluster -->
    <circle cx="980" cy="500" r="3"/>
    <circle cx="950" cy="540" r="2.5"/>
    <circle cx="1010" cy="540" r="2"/>
    <circle cx="930" cy="500" r="2"/>
    <circle cx="990" cy="460" r="2.5"/>
    <circle cx="1030" cy="500" r="2"/>
    <circle cx="960" cy="580" r="3"/>
    <circle cx="1000" cy="600" r="2"/>
    <circle cx="920" cy="560" r="2.5"/>
    <circle cx="1040" cy="560" r="2"/>
    <!-- top-right scatter -->
    <circle cx="940" cy="120" r="2.5"/>
    <circle cx="980" cy="150" r="2"/>
    <circle cx="1010" cy="110" r="2"/>
    <circle cx="900" cy="160" r="2"/>
    <circle cx="960" cy="90" r="2.5"/>
    <!-- bottom-left scatter -->
    <circle cx="140" cy="560" r="2.5"/>
    <circle cx="110" cy="600" r="2"/>
    <circle cx="180" cy="580" r="2"/>
    <circle cx="160" cy="620" r="2.5"/>
    <circle cx="100" cy="540" r="2"/>
  </g>

  <!-- ===================== Subtle vector arrows (background) ===================== -->
  <g stroke="#4f6bbf" stroke-width="1.5" opacity="0.4" fill="none">
    <line x1="240" y1="430" x2="300" y2="380" marker-end="url(#arrow)"/>
    <line x1="240" y1="430" x2="310" y2="450" marker-end="url(#arrow)"/>
    <line x1="240" y1="430" x2="270" y2="500" marker-end="url(#arrow)"/>
    <line x1="850" y1="270" x2="900" y2="230" marker-end="url(#arrow)"/>
    <line x1="850" y1="270" x2="910" y2="300" marker-end="url(#arrow)"/>
  </g>

  <!-- ===================== Neural network (top, above title) ===================== -->
  <g opacity="0.55">
    <!-- connections -->
    <g stroke="#5a72c8" stroke-width="1" opacity="0.5">
      <line x1="430" y1="200" x2="510" y2="170"/>
      <line x1="430" y1="200" x2="510" y2="230"/>
      <line x1="430" y1="240" x2="510" y2="170"/>
      <line x1="430" y1="240" x2="510" y2="230"/>
      <line x1="510" y1="170" x2="610" y2="200"/>
      <line x1="510" y1="230" x2="610" y2="200"/>
      <line x1="610" y1="200" x2="690" y2="170"/>
      <line x1="610" y1="200" x2="690" y2="230"/>
    </g>
    <!-- nodes -->
    <g fill="#8ba2ff">
      <circle cx="430" cy="200" r="5"/>
      <circle cx="430" cy="240" r="5"/>
      <circle cx="510" cy="170" r="5"/>
      <circle cx="510" cy="230" r="5"/>
      <circle cx="610" cy="200" r="6"/>
      <circle cx="690" cy="170" r="5"/>
      <circle cx="690" cy="230" r="5"/>
    </g>
  </g>

  <!-- ===================== Title ===================== -->
  <text x="560" y="380" text-anchor="middle" fill="#ffffff" font-size="48" font-weight="bold" letter-spacing="1">Unboxing the AI Black Box</text>

  <!-- Subtitle -->
  <text x="560" y="420" text-anchor="middle" fill="#a9b4d4" font-size="18">A 10,000-Foot View of How LLMs Work</text>

  <!-- thin accent line under title -->
  <line x1="460" y1="438" x2="660" y2="438" stroke="#5a72c8" stroke-width="2" opacity="0.6"/>

  <!-- ===================== Neural network (bottom, below subtitle) ===================== -->
  <g opacity="0.5">
    <g stroke="#5a72c8" stroke-width="1" opacity="0.5">
      <line x1="470" y1="500" x2="540" y2="480"/>
      <line x1="470" y1="500" x2="540" y2="520"/>
      <line x1="540" y1="480" x2="610" y2="500"/>
      <line x1="540" y1="520" x2="610" y2="500"/>
      <line x1="610" y1="500" x2="660" y2="480"/>
      <line x1="610" y1="500" x2="660" y2="520"/>
    </g>
    <g fill="#8ba2ff">
      <circle cx="470" cy="500" r="4.5"/>
      <circle cx="540" cy="480" r="4.5"/>
      <circle cx="540" cy="520" r="4.5"/>
      <circle cx="610" cy="500" r="5"/>
      <circle cx="660" cy="480" r="4.5"/>
      <circle cx="660" cy="520" r="4.5"/>
    </g>
  </g>
</svg>
