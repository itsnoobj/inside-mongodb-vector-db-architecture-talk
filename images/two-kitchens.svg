<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="monospace">
  <rect width="900" height="340" fill="#1e1e2e"/>

  <!-- incoming orders / writes -->
  <text x="450" y="32" fill="#89b4fa" font-size="14" text-anchor="middle">orders coming in  (writes)</text>
  <g fill="#45475a" stroke="#89b4fa" stroke-width="1">
    <rect x="352" y="42" width="30" height="20"/>
    <rect x="388" y="42" width="30" height="20"/>
    <rect x="424" y="42" width="30" height="20"/>
    <rect x="460" y="42" width="30" height="20"/>
    <rect x="496" y="42" width="30" height="20"/>
  </g>

  <!-- a la carte line = mongod -->
  <rect x="60" y="82" width="360" height="198" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="240" y="118" fill="#a6e3a1" font-size="19" text-anchor="middle" font-weight="bold">À la carte line</text>
  <text x="240" y="142" fill="#a6adc8" font-size="13" text-anchor="middle">= mongod</text>
  <text x="240" y="182" fill="#cdd6f4" font-size="15" text-anchor="middle">Takes orders. Serves now.</text>
  <text x="240" y="208" fill="#cdd6f4" font-size="15" text-anchor="middle">Must be instant.</text>
  <rect x="110" y="230" width="260" height="34" fill="#45475a"/>
  <text x="240" y="253" fill="#a6e3a1" font-size="13" text-anchor="middle">never blocked</text>

  <!-- ticket stream arrow -->
  <line x1="420" y1="180" x2="475" y2="180" stroke="#f9e2af" stroke-width="2.5"/>
  <polygon points="483,180 471,174 471,186" fill="#f9e2af"/>
  <text x="450" y="166" fill="#f9e2af" font-size="11" text-anchor="middle">ticket</text>
  <text x="450" y="202" fill="#f9e2af" font-size="11" text-anchor="middle">stream</text>

  <!-- prep kitchen = mongot -->
  <rect x="485" y="82" width="360" height="198" fill="#313244" stroke="#4EC9B0" stroke-width="2"/>
  <text x="665" y="118" fill="#4EC9B0" font-size="19" text-anchor="middle" font-weight="bold">Prep kitchen</text>
  <text x="665" y="142" fill="#a6adc8" font-size="13" text-anchor="middle">= mongot</text>
  <text x="665" y="182" fill="#cdd6f4" font-size="15" text-anchor="middle">Watches the tickets.</text>
  <text x="665" y="208" fill="#cdd6f4" font-size="15" text-anchor="middle">Pre-builds ahead of time.</text>
  <rect x="535" y="230" width="260" height="34" fill="#45475a" stroke="#4EC9B0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="665" y="253" fill="#f9e2af" font-size="12" text-anchor="middle">may run a few tickets behind</text>

  <!-- footer -->
  <text x="450" y="316" fill="#585b70" font-size="14" text-anchor="middle">The prep kitchen can lag — <tspan fill="#a6e3a1">the line never slows down for it.</tspan></text>
</svg>
