<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="monospace">
  <rect width="900" height="320" fill="#1e1e2e"/>

  <!-- 1. Co-located -->
  <rect x="20" y="30" width="270" height="240" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="155" y="60" fill="#a6e3a1" font-size="16" text-anchor="middle" font-weight="bold">① Co-located</text>
  <rect x="60" y="90" width="190" height="90" fill="#45475a"/>
  <text x="155" y="118" fill="#585b70" font-size="12" text-anchor="middle">one host</text>
  <rect x="80" y="128" width="70" height="38" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1"/>
  <text x="115" y="152" fill="#a6e3a1" font-size="12" text-anchor="middle">mongod</text>
  <rect x="160" y="128" width="70" height="38" fill="#1e1e2e" stroke="#4EC9B0" stroke-width="1"/>
  <text x="195" y="152" fill="#4EC9B0" font-size="12" text-anchor="middle">mongot</text>
  <text x="155" y="220" fill="#cdd6f4" font-size="13" text-anchor="middle">dev · small</text>
  <text x="155" y="246" fill="#585b70" font-size="12" text-anchor="middle">simplest</text>

  <!-- 2. Isolated -->
  <rect x="315" y="30" width="270" height="240" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="450" y="60" fill="#f9e2af" font-size="16" text-anchor="middle" font-weight="bold">② Isolated</text>
  <rect x="345" y="95" width="100" height="60" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1"/>
  <text x="395" y="130" fill="#a6e3a1" font-size="12" text-anchor="middle">mongod</text>
  <rect x="455" y="95" width="100" height="60" fill="#1e1e2e" stroke="#4EC9B0" stroke-width="1"/>
  <text x="505" y="130" fill="#4EC9B0" font-size="12" text-anchor="middle">mongot</text>
  <line x1="445" y1="125" x2="455" y2="125" stroke="#585b70" stroke-width="1.5"/>
  <text x="450" y="180" fill="#585b70" font-size="11" text-anchor="middle">separate hosts</text>
  <text x="450" y="220" fill="#cdd6f4" font-size="13" text-anchor="middle">production</text>
  <text x="450" y="246" fill="#585b70" font-size="12" text-anchor="middle">search can't starve the DB</text>

  <!-- 3. Sharded -->
  <rect x="610" y="30" width="270" height="240" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="745" y="60" fill="#89b4fa" font-size="16" text-anchor="middle" font-weight="bold">③ Sharded</text>
  <rect x="700" y="82" width="90" height="30" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1"/>
  <text x="745" y="103" fill="#89b4fa" font-size="12" text-anchor="middle">mongos</text>
  <line x1="720" y1="112" x2="690" y2="140" stroke="#585b70" stroke-width="1"/>
  <line x1="770" y1="112" x2="800" y2="140" stroke="#585b70" stroke-width="1"/>
  <rect x="645" y="142" width="90" height="52" fill="#45475a"/>
  <text x="690" y="162" fill="#a6e3a1" font-size="10" text-anchor="middle">mongod</text>
  <text x="690" y="182" fill="#4EC9B0" font-size="10" text-anchor="middle">mongot</text>
  <rect x="755" y="142" width="90" height="52" fill="#45475a"/>
  <text x="800" y="162" fill="#a6e3a1" font-size="10" text-anchor="middle">mongod</text>
  <text x="800" y="182" fill="#4EC9B0" font-size="10" text-anchor="middle">mongot</text>
  <text x="745" y="220" fill="#cdd6f4" font-size="13" text-anchor="middle">scale-out</text>
  <text x="745" y="246" fill="#585b70" font-size="12" text-anchor="middle">fan-out + merge</text>

  <!-- footer -->
  <text x="450" y="302" fill="#585b70" font-size="13" text-anchor="middle">Same query, same code — the topology changes underneath as you grow.</text>
</svg>
