<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, -apple-system, sans-serif">
  <rect width="1600" height="900" fill="#1a1a2e"/>
  
  <!-- Title -->
  <text x="800" y="60" text-anchor="middle" fill="#cdd6f4" font-size="28" font-weight="bold">Six Degrees of Separation</text>
  <text x="800" y="95" text-anchor="middle" fill="#a6adc8" font-size="16">Any person on Earth reachable through ~6 connections</text>
  
  <!-- Chain of 6 colored circles -->
  <!-- Circle 1 - You -->
  <circle cx="150" cy="400" r="55" fill="#a6e3a1"/>
  <text x="150" y="395" text-anchor="middle" fill="#1e1e2e" font-size="28" font-weight="bold">1</text>
  <text x="150" y="420" text-anchor="middle" fill="#1e1e2e" font-size="12">YOU</text>
  
  <!-- Connection line -->
  <line x1="205" y1="400" x2="265" y2="400" stroke="#a6adc8" stroke-width="3"/>
  
  <!-- Circle 2 -->
  <circle cx="320" cy="400" r="55" fill="#f38ba8"/>
  <text x="320" y="408" text-anchor="middle" fill="#1e1e2e" font-size="28" font-weight="bold">2</text>
  
  <line x1="375" y1="400" x2="435" y2="400" stroke="#a6adc8" stroke-width="3"/>
  
  <!-- Circle 3 -->
  <circle cx="490" cy="400" r="55" fill="#f9e2af"/>
  <text x="490" y="408" text-anchor="middle" fill="#1e1e2e" font-size="28" font-weight="bold">3</text>
  
  <line x1="545" y1="400" x2="605" y2="400" stroke="#a6adc8" stroke-width="3"/>
  
  <!-- Circle 4 -->
  <circle cx="660" cy="400" r="55" fill="#89b4fa"/>
  <text x="660" y="408" text-anchor="middle" fill="#1e1e2e" font-size="28" font-weight="bold">4</text>
  
  <line x1="715" y1="400" x2="775" y2="400" stroke="#a6adc8" stroke-width="3"/>
  
  <!-- Circle 5 -->
  <circle cx="830" cy="400" r="55" fill="#cba6f7"/>
  <text x="830" y="408" text-anchor="middle" fill="#1e1e2e" font-size="28" font-weight="bold">5</text>
  
  <line x1="885" y1="400" x2="945" y2="400" stroke="#a6adc8" stroke-width="3"/>
  
  <!-- Circle 6 - Target -->
  <circle cx="1000" cy="400" r="55" fill="#94e2d5"/>
  <text x="1000" y="395" text-anchor="middle" fill="#1e1e2e" font-size="28" font-weight="bold">6</text>
  <text x="1000" y="420" text-anchor="middle" fill="#1e1e2e" font-size="12">TARGET</text>
  
  <!-- Arrow below chain -->
  <line x1="150" y1="480" x2="1000" y2="480" stroke="#f9e2af" stroke-width="2" marker-end="url(#arw3)"/>
  <text x="575" y="510" text-anchor="middle" fill="#f9e2af" font-size="14">You → a random person anywhere in the world</text>
  
  <!-- Right side: Globe with network -->
  <circle cx="1350" cy="380" r="180" fill="none" stroke="#6c7086" stroke-width="2"/>
  <!-- Globe lines -->
  <ellipse cx="1350" cy="380" rx="180" ry="70" fill="none" stroke="#3a3750" stroke-width="1"/>
  <ellipse cx="1350" cy="380" rx="90" ry="180" fill="none" stroke="#3a3750" stroke-width="1"/>
  <line x1="1170" y1="380" x2="1530" y2="380" stroke="#3a3750" stroke-width="1"/>
  <line x1="1350" y1="200" x2="1350" y2="560" stroke="#3a3750" stroke-width="1"/>
  
  <!-- Network pins on globe -->
  <circle cx="1280" cy="290" r="8" fill="#f38ba8"/>
  <circle cx="1400" cy="270" r="8" fill="#f38ba8"/>
  <circle cx="1450" cy="350" r="8" fill="#f38ba8"/>
  <circle cx="1300" cy="420" r="8" fill="#f38ba8"/>
  <circle cx="1420" cy="450" r="8" fill="#f38ba8"/>
  <circle cx="1250" cy="360" r="8" fill="#f38ba8"/>
  <circle cx="1380" cy="320" r="8" fill="#f38ba8"/>
  <circle cx="1320" cy="480" r="8" fill="#f38ba8"/>
  
  <!-- Connection lines between pins -->
  <line x1="1280" y1="290" x2="1400" y2="270" stroke="#89b4fa" stroke-width="1.5" opacity="0.6"/>
  <line x1="1400" y1="270" x2="1450" y2="350" stroke="#89b4fa" stroke-width="1.5" opacity="0.6"/>
  <line x1="1450" y1="350" x2="1420" y2="450" stroke="#89b4fa" stroke-width="1.5" opacity="0.6"/>
  <line x1="1250" y1="360" x2="1300" y2="420" stroke="#89b4fa" stroke-width="1.5" opacity="0.6"/>
  <line x1="1300" y1="420" x2="1320" y2="480" stroke="#89b4fa" stroke-width="1.5" opacity="0.6"/>
  <line x1="1280" y1="290" x2="1250" y2="360" stroke="#89b4fa" stroke-width="1.5" opacity="0.6"/>
  <line x1="1380" y1="320" x2="1450" y2="350" stroke="#89b4fa" stroke-width="1.5" opacity="0.6"/>
  <line x1="1380" y1="320" x2="1300" y2="420" stroke="#89b4fa" stroke-width="1.5" opacity="0.6"/>
  <line x1="1420" y1="450" x2="1320" y2="480" stroke="#89b4fa" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Bottom: DiskANN connection -->
  <rect x="200" y="620" width="1200" height="120" rx="12" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="800" y="665" text-anchor="middle" fill="#a6e3a1" font-size="22" font-weight="bold">DiskANN: Same idea, for vectors on disk</text>
  <text x="800" y="700" text-anchor="middle" fill="#a6adc8" font-size="16">Any vector reachable in ~10-20 hops. Graph lives on NVMe SSD, not RAM.</text>
  <text x="800" y="725" text-anchor="middle" fill="#f9e2af" font-size="14">Trade: +5-10ms latency for 30x less RAM ($5K/mo → $200/mo)</text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arw3" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7" fill="none" stroke="#f9e2af" stroke-width="1.5"/>
    </marker>
  </defs>
</svg>
