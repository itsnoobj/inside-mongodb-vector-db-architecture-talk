<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400">
  <rect width="1120" height="400" fill="#1a1a2e"/>
  <style>text { font-family: Arial, Helvetica, sans-serif; }</style>

  <!-- Input matrix -->
  <text x="150" y="35" text-anchor="middle" fill="#4a9eff" font-size="15" font-weight="bold">Your Words</text>
  <text x="150" y="55" text-anchor="middle" fill="#88bbff" font-size="12">(as numbers)</text>
  
  <rect x="70" y="70" width="160" height="200" rx="6" fill="#1e3a5f" stroke="#4a9eff" stroke-width="2"/>
  <text x="90" y="100" fill="#aaccff" font-size="11">[0.8, -0.1, 0.6...]</text>
  <text x="90" y="125" fill="#aaccff" font-size="11">[0.3,  0.7, 0.2...]</text>
  <text x="90" y="150" fill="#aaccff" font-size="11">[0.1,  0.9, 0.5...]</text>
  <text x="90" y="175" fill="#aaccff" font-size="11">[0.5,  0.2, 0.8...]</text>
  <text x="90" y="200" fill="#667788" font-size="11">     ...</text>
  <text x="90" y="225" fill="#aaccff" font-size="11">[0.4, -0.3, 0.1...]</text>
  
  <text x="150" y="295" text-anchor="middle" fill="#88bbff" font-size="12">500 words × 1536 dims</text>

  <!-- × symbol -->
  <text x="270" y="175" fill="#ffffff" font-size="36" font-weight="bold">×</text>

  <!-- Weight matrix -->
  <text x="470" y="35" text-anchor="middle" fill="#ffaa00" font-size="15" font-weight="bold">Learned Patterns</text>
  <text x="470" y="55" text-anchor="middle" fill="#ddaa55" font-size="12">(what the AI knows)</text>
  
  <rect x="310" y="70" width="320" height="200" rx="6" fill="#3a2e1a" stroke="#ffaa00" stroke-width="2"/>
  <!-- Dense grid pattern -->
  <defs>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#ffaa00" opacity="0.15"/>
    </pattern>
  </defs>
  <rect x="315" y="75" width="310" height="190" fill="url(#grid)"/>
  
  <text x="470" y="165" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">2.3 MILLION</text>
  <text x="470" y="188" text-anchor="middle" fill="#ffddaa" font-size="13">learned weights</text>
  
  <text x="470" y="295" text-anchor="middle" fill="#ddaa55" font-size="12">1536 × 1536 per layer</text>

  <!-- = symbol -->
  <text x="670" y="175" fill="#ffffff" font-size="36" font-weight="bold">=</text>

  <!-- Output -->
  <text x="830" y="35" text-anchor="middle" fill="#66ff66" font-size="15" font-weight="bold">Prediction</text>
  <text x="830" y="55" text-anchor="middle" fill="#88dd88" font-size="12">(refined meaning)</text>
  
  <rect x="720" y="70" width="160" height="200" rx="6" fill="#1a3a1a" stroke="#66ff66" stroke-width="2"/>
  <text x="740" y="100" fill="#aaffaa" font-size="11">[0.2,  0.9, 0.1...]</text>
  <text x="740" y="125" fill="#aaffaa" font-size="11">[0.7,  0.1, 0.8...]</text>
  <text x="740" y="150" fill="#aaffaa" font-size="11">[0.4,  0.6, 0.3...]</text>
  <text x="740" y="175" fill="#aaffaa" font-size="11">[0.9,  0.3, 0.5...]</text>
  <text x="740" y="200" fill="#557755" font-size="11">     ...</text>
  <text x="740" y="225" fill="#aaffaa" font-size="11">[0.1,  0.8, 0.4...]</text>
  
  <text x="830" y="295" text-anchor="middle" fill="#88dd88" font-size="12">500 × 1536 output</text>

  <!-- Repeat arrow -->
  <text x="960" y="140" fill="#bb88ff" font-size="13" font-weight="bold">repeat</text>
  <text x="960" y="165" fill="#bb88ff" font-size="18" font-weight="bold">96×</text>
  <text x="960" y="190" fill="#9977cc" font-size="12">(layers)</text>
  
  <!-- Curved arrow suggesting loop -->
  <path d="M 895 170 Q 1050 170 1050 250 Q 1050 320 830 320" fill="none" stroke="#bb88ff" stroke-width="2" stroke-dasharray="6" marker-end="url(#parrow)"/>
  <defs><marker id="parrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#bb88ff"/></marker></defs>

  <!-- Bottom -->
  <text x="560" y="370" text-anchor="middle" fill="#aaa" font-size="13">Each layer transforms meaning further — grammar → context → reasoning → output</text>
</svg>
