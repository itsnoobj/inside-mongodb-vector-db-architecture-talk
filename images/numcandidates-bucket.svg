<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="monospace">
  <rect width="900" height="560" fill="#1e1e2e"/>

  <!-- HNSW graph nodes (background, visited vs unvisited) -->
  <circle cx="150" cy="200" r="14" fill="#45475a" stroke="#585b70" stroke-width="1.5"/>
  <circle cx="220" cy="140" r="14" fill="#45475a" stroke="#585b70" stroke-width="1.5"/>
  <circle cx="220" cy="260" r="14" fill="#45475a" stroke="#585b70" stroke-width="1.5"/>
  <circle cx="290" cy="180" r="14" fill="#45475a" stroke="#585b70" stroke-width="1.5"/>
  <circle cx="290" cy="220" r="14" fill="#45475a" stroke="#585b70" stroke-width="1.5"/>
  <circle cx="360" cy="120" r="14" fill="#45475a" stroke="#585b70" stroke-width="1.5"/>
  <circle cx="360" cy="200" r="14" fill="#45475a" stroke="#585b70" stroke-width="1.5"/>
  <circle cx="360" cy="280" r="14" fill="#45475a" stroke="#585b70" stroke-width="1.5"/>
  <circle cx="430" cy="160" r="14" fill="#45475a" stroke="#585b70" stroke-width="1.5"/>
  <circle cx="430" cy="240" r="14" fill="#45475a" stroke="#585b70" stroke-width="1.5"/>
  <circle cx="500" cy="200" r="14" fill="#45475a" stroke="#585b70" stroke-width="1.5"/>

  <!-- graph edges -->
  <line x1="150" y1="200" x2="220" y2="140" stroke="#313244" stroke-width="2"/>
  <line x1="150" y1="200" x2="220" y2="260" stroke="#313244" stroke-width="2"/>
  <line x1="220" y1="140" x2="290" y2="180" stroke="#313244" stroke-width="2"/>
  <line x1="220" y1="260" x2="290" y2="220" stroke="#313244" stroke-width="2"/>
  <line x1="290" y1="180" x2="360" y2="120" stroke="#313244" stroke-width="2"/>
  <line x1="290" y1="180" x2="360" y2="200" stroke="#313244" stroke-width="2"/>
  <line x1="290" y1="220" x2="360" y2="200" stroke="#313244" stroke-width="2"/>
  <line x1="290" y1="220" x2="360" y2="280" stroke="#313244" stroke-width="2"/>
  <line x1="360" y1="120" x2="430" y2="160" stroke="#313244" stroke-width="2"/>
  <line x1="360" y1="200" x2="430" y2="160" stroke="#313244" stroke-width="2"/>
  <line x1="360" y1="200" x2="430" y2="240" stroke="#313244" stroke-width="2"/>
  <line x1="360" y1="280" x2="430" y2="240" stroke="#313244" stroke-width="2"/>
  <line x1="430" y1="160" x2="500" y2="200" stroke="#313244" stroke-width="2"/>
  <line x1="430" y1="240" x2="500" y2="200" stroke="#313244" stroke-width="2"/>

  <!-- bucket outline -->
  <path d="M580 110 L580 300 Q580 340 620 340 L700 340 Q740 340 740 300 L740 110" 
        fill="none" stroke="#6c7086" stroke-width="2.5" stroke-dasharray="6,4"/>
  
  <!-- visited nodes inside bucket (highlighted) -->
  <circle cx="620" cy="150" r="14" fill="#1e1e2e" stroke="#f9e2af" stroke-width="2.5"/>
  <text x="620" y="155" fill="#f9e2af" font-size="12" text-anchor="middle">3</text>
  
  <circle cx="700" cy="150" r="14" fill="#1e1e2e" stroke="#f9e2af" stroke-width="2.5"/>
  <text x="700" y="155" fill="#f9e2af" font-size="12" text-anchor="middle">7</text>
  
  <circle cx="620" cy="210" r="14" fill="#1e1e2e" stroke="#f9e2af" stroke-width="2.5"/>
  <text x="620" y="215" fill="#f9e2af" font-size="12" text-anchor="middle">12</text>
  
  <circle cx="700" cy="210" r="14" fill="#1e1e2e" stroke="#f9e2af" stroke-width="2.5"/>
  <text x="700" y="215" fill="#f9e2af" font-size="12" text-anchor="middle">1</text>
  
  <circle cx="620" cy="270" r="14" fill="#1e1e2e" stroke="#f9e2af" stroke-width="2.5"/>
  <text x="620" y="275" fill="#f9e2af" font-size="12" text-anchor="middle">9</text>
  
  <circle cx="700" cy="270" r="14" fill="#1e1e2e" stroke="#f9e2af" stroke-width="2.5"/>
  <text x="700" y="275" fill="#f9e2af" font-size="12" text-anchor="middle">4</text>

  <!-- bucket label -->
  <text x="660" y="80" fill="#6c7086" font-size="16" text-anchor="middle" font-weight="bold">visited</text>

  <!-- arrow from graph to bucket -->
  <path d="M520 200 Q545 190 560 150" fill="none" stroke="#f9e2af" stroke-width="2"/>
  <polygon points="560,150 565,162 555,162" fill="#f9e2af"/>
  <text x="545" y="175" fill="#f9e2af" font-size="13" text-anchor="end">walk</text>

  <!-- numCandidates label, offset to the right of the connecting arrow -->
  <text x="790" y="375" fill="#f9e2af" font-size="18" text-anchor="middle" font-weight="bold">numCandidates</text>
  <text x="790" y="398" fill="#6c7086" font-size="14" text-anchor="middle">= nodes visited</text>

  <!-- ranking box -->
  <rect x="550" y="455" width="220" height="48" fill="#45475a" stroke="#a6e3a1" stroke-width="2"/>
  <text x="660" y="485" fill="#a6e3a1" font-size="16" text-anchor="middle" font-weight="bold">rank → return top 10</text>

  <!-- arrow from bucket straight down to ranking, clear of any label -->
  <line x1="660" y1="340" x2="660" y2="444" stroke="#a6e3a1" stroke-width="2"/>
  <polygon points="660,453 653,441 667,441" fill="#a6e3a1"/>

  <!-- left side explanation -->
  <text x="80" y="350" fill="#585b70" font-size="14" text-anchor="start">query vector</text>
  <line x1="80" y1="365" x2="80" y2="200" stroke="#89b4fa" stroke-width="2" stroke-dasharray="4,3"/>
  <circle cx="80" cy="200" r="8" fill="#89b4fa"/>

  <!-- greedy walk arrow -->
  <path d="M95 200 Q120 200 140 200" fill="none" stroke="#89b4fa" stroke-width="2"/>
  <polygon points="148,200 136,194 136,206" fill="#89b4fa"/>
  <text x="120" y="185" fill="#89b4fa" font-size="11" text-anchor="middle">greedy</text>

  <!-- bottom caption -->
  <text x="450" y="540" fill="#6c7086" font-size="15" text-anchor="middle">Raise numCandidates → more recall, more latency</text>
</svg>