<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 520" font-family="monospace">
  <rect width="1010" height="520" fill="#1e1e2e"/>

  <!-- client box (blue) -->
  <rect x="40" y="185" width="240" height="150" fill="#313244" rx="12" stroke="#89b4fa" stroke-width="2.5"/>
  <text x="160" y="270" fill="#89b4fa" font-size="30" text-anchor="middle" font-weight="bold">client</text>

  <!-- mongod box (green) -->
  <rect x="385" y="185" width="240" height="150" fill="#313244" rx="12" stroke="#a6e3a1" stroke-width="2.5"/>
  <text x="505" y="248" fill="#a6e3a1" font-size="30" text-anchor="middle" font-weight="bold">mongod</text>
  <rect x="425" y="272" width="160" height="42" fill="#45475a" rx="6"/>
  <text x="505" y="300" fill="#f9e2af" font-size="19" text-anchor="middle">query proxy</text>

  <!-- mongot box (teal) -->
  <rect x="730" y="185" width="240" height="150" fill="#313244" rx="12" stroke="#4EC9B0" stroke-width="2.5"/>
  <text x="850" y="258" fill="#4EC9B0" font-size="30" text-anchor="middle" font-weight="bold">mongot</text>
  <text x="850" y="294" fill="#a6adc8" font-size="16" text-anchor="middle">HNSW index</text>

  <!-- top row: forward path (client -> mongod -> mongot), labels above boxes -->
  <text x="332" y="160" fill="#585b70" font-size="17" text-anchor="middle">$vectorSearch</text>
  <line x1="282" y1="232" x2="371" y2="232" stroke="#89b4fa" stroke-width="3"/>
  <polygon points="383,232 369,225 369,239" fill="#89b4fa"/>

  <text x="677" y="160" fill="#585b70" font-size="17" text-anchor="middle">forward</text>
  <line x1="627" y1="232" x2="716" y2="232" stroke="#f9e2af" stroke-width="3"/>
  <polygon points="728,232 714,225 714,239" fill="#f9e2af"/>

  <!-- bottom row: return path (mongot -> mongod -> client), labels below boxes -->
  <line x1="728" y1="288" x2="639" y2="288" stroke="#4EC9B0" stroke-width="3"/>
  <polygon points="627,288 641,281 641,295" fill="#4EC9B0"/>
  <text x="677" y="372" fill="#585b70" font-size="17" text-anchor="middle">scores {_id}</text>

  <line x1="383" y1="288" x2="294" y2="288" stroke="#a6e3a1" stroke-width="3"/>
  <polygon points="282,288 296,281 296,295" fill="#a6e3a1"/>
  <text x="332" y="372" fill="#585b70" font-size="17" text-anchor="middle">results</text>

  <!-- caption -->
  <text x="505" y="430" fill="#585b70" font-size="18" text-anchor="middle">mongod is the only endpoint · the client never talks to mongot</text>
</svg>
